  instrument:
    manufacturer: "LUMICKS"
    model: "C-Trap"
    system_type: "commercial"

  optical_traps:
    number_of_traps: 2
    trap_configuration: "dual-trap"
    laser_wavelength_nm: 1064.0
    laser_power_mW: 

  trap_stiffness:
    value: 0.3
    unit: "pN/nm"

  bead_diameter:
    value: 2.14
    unit: "μm"

  bead_properties:
