# "FANCD2-FANCI surveys DNA and recognizes double- to single-stranded junctions"
# =============================================================================

experiment_id: "FANCD2-2024-001"
metadata_version: "1.0.0"
created_date: "2024-07-15T10:00:00"
last_modified: "2024-07-15T10:00:00"

citation:
  title: "FANCD2-FANCI surveys DNA and recognizes double- to single-stranded junctions"
  authors:
    - "Passmore, Lori A."
    - "Rueda, David S."
  journal: "Nature"
  year: 2024
  volume: ""
  pages: ""
  doi: "10.1038/s41586-024-07770-w"
  pubmed_id: ""

# =============================================================================
# HARDWARE CONDITIONS
# =============================================================================
