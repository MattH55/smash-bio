    doi: "10.5281/zenodo.XXXXXXX"
    accession_number: ""

# =============================================================================
# NOTES
# =============================================================================
notes: |
  This experiment investigates how the FANCD2-FANCI (D2-I) complex surveys DNA
  and recognizes double- to single-stranded junctions, which is critical for
  the Fanconi Anemia DNA repair pathway.
  
  Key methodological notes:
  - ss-dsDNA junctions were created to mimic stalled replication forks
  - Both wild-type and monoubiquitinated D2-I were tested
  - Cryo-EM was used in parallel for structural analysis
  
  Experimental controls:
  - DNA-only controls for background fluorescence
  - Catalytically inactive variants for comparison
