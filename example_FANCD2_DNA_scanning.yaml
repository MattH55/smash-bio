  handles:
    type: "dsDNA"
    length_bp: 500
    length_nm: 170
    attachment_5prime: "biotin"
    attachment_3prime: "digoxigenin"

  protein:
    name: "FANCD2-FANCI heterodimer"
    abbreviation: "D2-I"
    uniprot_id: "Q9BXW9 (FANCD2), Q9NVI1 (FANCI)"
    molecular_weight_kDa: 370
    oligomeric_state: "heterodimer"
    expression_system: "insect"
    purification_method: "Affinity chromatography, size exclusion"
    concentration_nM: 10
    concentration_uM: 0.01
    storage_conditions: "-80°C in 50% glycerol"
    mutations: []
    tags:
      - "Twin-Strep"
    fluorescent_label:
      fluorophore: "Cy5"
      labeling_site: "N-terminus via SNAP-tag"
