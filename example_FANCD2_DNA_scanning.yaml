    magnification: 60
    immersion: "water"

  detection:
    position_detector_type: "QPD"
    position_resolution_nm: 0.5
    force_resolution_pN: 0.1
    data_acquisition_rate_Hz: 78125

  fluorescence:
    capability: "confocal"
    excitation_wavelengths_nm:
      - 561
      - 647
    emission_filters:
      - "600/50"
      - "700/75"
