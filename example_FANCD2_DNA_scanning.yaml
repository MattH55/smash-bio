# =============================================================================
# EXPERIMENTAL CONDITIONS
# =============================================================================
experimental_conditions:
  buffer:
    name: "Imaging buffer"
    composition: "25 mM Tris pH 7.5, 100 mM KCl, 5 mM MgCl2, 1 mM DTT, 0.1% BSA"
    pH: 7.5
    ionic_strength_mM: 130

  salts:
    - name: "KCl"
      concentration_mM: 100
    - name: "MgCl2"
      concentration_mM: 5

  temperature_C: 25.0

  nucleotides:
    ATP_mM: 1.0
    ATPgammaS_mM: 
    ADP_mM: 
    GTP_mM: 
    dNTPs_mM: 
    NTPs_mM: 
    other: ""

  oxygen_scavenging:
    system: "PCA-PCD"
    components: "PCA 2.5 mM, PCD 50 nM, Trolox 1 mM"

  surface_passivation: "BSA 0.1%"

  crowding_agents: []

  other_additives:
    - name: "DTT"
      concentration: "1 mM"
      purpose: "reducing agent"

# =============================================================================
# MEASUREMENT PARAMETERS
# =============================================================================
measurements:
  operation_mode: "force-clamp"

  force_range:
    minimum_pN: 5
    maximum_pN: 10

  loading_rate:
    value: 
    unit: ""

  clamp_force_pN: 5.0
  tension_pN: 5.0

  extension_range:
    minimum_nm: 10000
    maximum_nm: 16000

  measurement_duration_s: 300
  number_of_molecules: 87
  number_of_measurements_per_molecule: 3

  fluorescence_imaging:
    enabled: true
    acquisition_mode: "kymograph"
    frame_rate_Hz: 10
    exposure_time_ms: 100
    laser_power_uW: 50

# =============================================================================
# CALIBRATION
# =============================================================================
calibration:
  method: "power-spectrum"
  calibration_bead_diameter_um: 2.14
  drag_coefficient_pN_s_nm: 
  corner_frequency_Hz: 2500
  calibration_temperature_C: 25.0
  calibration_buffer: "PBS"
  position_sensitivity_nm_per_V: 
  calibration_date: "2024-07-01"
  calibration_file: "calibration_20240701.h5"

# =============================================================================
# DATA PROCESSING
# =============================================================================
data_processing:
  analysis_software:
    name: "Pylake"
    version: "1.2.0"
    url: "https://lumicks-pylake.readthedocs.io"

  filtering:
    method: "low-pass"
    cutoff_frequency_Hz: 1000
    window_size: 

  fitting_model:
    model_name: "WLC"
    persistence_length_nm: 50
    contour_length_nm: 16500
    stretch_modulus_pN: 1200

  statistical_analysis:
    methods:
      - "mean ± SEM"
      - "single-molecule tracking"
      - "dwell time analysis"
    confidence_level: 0.95
    sample_size: 87

  analysis_scripts:
    repository_url: "https://github.com/example/fancd2-analysis"
    script_files:
      - "tracking_analysis.py"
      - "dwell_time_fitting.py"

# =============================================================================
# RESULTS
# =============================================================================
results:
  primary_measurements:
    - parameter: "diffusion coefficient"
      value: 0.14
      error: 0.07
      unit: "μm²/s"
      n: 87
    - parameter: "mean sliding speed"
      value: 0.81
      error: 0.14
      unit: "μm/s"
      n: 87
    - parameter: "persistent stall dwell time"
      value: 50
      error: 10
      unit: "s"
      n: 45
    - parameter: "transient stall dwell time"
      value: 7
      error: 2
      unit: "s"
      n: 42

  key_findings:
    - "D2-I forms a sliding clamp around dsDNA and diffuses along it"
    - "Mean diffusion coefficient ~0.14 ± 0.07 μm²/s on λ-DNA"
    - "D2-I stalls at ss-dsDNA junctions with two types: persistent (~50s) and transient (~7s)"
    - "KR helix in FANCD2 is critical for recognizing ss/ds boundary"
    - "Monoubiquitination does not significantly alter diffusion speed"

