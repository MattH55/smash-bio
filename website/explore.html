<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F9TN1HCQ2E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-F9TN1HCQ2E');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Studies | SMASH-BIO</title>
  <meta name="description" content="Faceted search over annotated single-molecule force spectroscopy studies: technique, biological system, organism, instrument, data availability.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body>
  <nav id="site-nav"></nav>
  <header class="page-header">
    <div class="container">
      <h1>Explore studies</h1>
      <p>Search and filter every annotated force-spectroscopy study. Facet counts update as you filter; your filters are kept in the URL so you can share a view.</p>
    </div>
  </header>

  <main class="container explorer">
    <div class="scrim" id="scrim"></div>
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="filters-head"><strong>Filters</strong><button class="icon-btn" id="close-filters" aria-label="Close filters"><i class="fas fa-xmark"></i></button></div>
      <div id="facets"></div>
    </aside>

    <section>
      <div class="results-bar">
        <div class="search-input"><i class="fas fa-magnifying-glass"></i>
          <input type="search" id="q" placeholder="Search title, molecule, organism, author, DOI…" aria-label="Search"></div>
        <button class="btn btn-secondary filter-toggle" id="open-filters"><i class="fas fa-sliders"></i> Filters <span id="nf"></span></button>
      </div>
      <div class="active-filters" id="active"></div>
      <div class="results-meta">
        <span id="count" class="num">Loading…</span>
        <div class="toolbar">
          <select id="sort" aria-label="Sort">
            <option value="year">Newest</option>
            <option value="cited">Most cited</option>
            <option value="fair">Most complete metadata</option>
            <option value="data">Data availability</option>
            <option value="title">Title A–Z</option>
          </select>
          <button class="btn btn-ghost btn-sm view-table-btn" id="view-btn" title="Toggle table view"><i class="fas fa-table"></i> <span>Table</span></button>
          <button class="btn btn-ghost btn-sm" id="dl-csv" title="Download filtered results as CSV"><i class="fas fa-download"></i> CSV</button>
        </div>
      </div>
      <div id="results"><div class="loading"><span class="spinner"></span> Loading index…</div></div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="data/index.js"></script>
  <script src="data/modules.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
