<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Simulations (beta) | SMASH-BIO</title>
  <meta name="description" content="Filter indexed pulling simulations by molecule type, model family, unit system, protocol mode, data availability and match level to experiment.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/sim.css">
  <script src="../js/app.js"></script>
  <script src="data/index.js"></script>
  <script src="data/systems.js"></script>
  <script src="js/sim.js"></script>
</head>
<body>
  <nav id="site-nav"></nav>
  <header class="page-header">
    <div class="container">
      <h1>Explore simulations (beta)</h1>
      <p>Filter the indexed pulling simulations. Filters are kept in the URL, so a view can be
        shared. Simulations and experiments are never mixed in this list.</p>
    </div>
  </header>

  <main class="container" style="padding-bottom:60px">
    <div id="sim-banner"></div>
    <section class="section-tight">
      <div class="card"><div class="sim-filters">
        <div><label for="f-q">Search</label>
          <input type="search" id="f-q" placeholder="system, title, software, DOI…"></div>
        <div><label for="f-molecule">Molecule type</label><select id="f-molecule"></select></div>
        <div><label for="f-family">Model family</label><select id="f-family"></select></div>
        <div><label for="f-unit">Unit system</label><select id="f-unit"></select></div>
        <div><label for="f-mode">Protocol mode</label><select id="f-mode"></select></div>
        <div><label for="f-match">Match level</label><select id="f-match"></select></div>
        <div><label for="f-data">Data shared</label><select id="f-data"></select></div>
        <div><label for="f-sort">Sort</label><select id="f-sort">
          <option value="year">Newest</option>
          <option value="system">System A–Z</option>
          <option value="matches">Most experiment links</option>
          <option value="fair">Most complete metadata</option>
        </select></div>
      </div>
      <div class="results-meta" style="margin-top:10px">
        <span id="f-count" class="num">…</span>
        <button class="btn btn-ghost btn-sm" id="f-reset"><i class="fas fa-rotate-left"></i> Reset</button>
      </div></div>
    </section>
    <section id="f-results" class="card-grid"></section>
    <p class="sim-axis-note">Records in reduced units are marked; their values are never shown on a
      physical axis without a stated conversion.</p>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/explore.js"></script>
</body>
</html>
