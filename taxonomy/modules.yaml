  typical_assays: [large_object]
  typical_geometries: [one_bead]
  canonical_systems: []
  table3_fields: [hardware.*, assay.*, biological_system.entities, solution.*]
- id: membranes
  label: Membranes and vesicles
  table3_type: rheology
  priority: 50
