- id: receptor_ligand
  label: Receptor–ligand and adhesion bonds
  table3_type: extended
  priority: 60
  description: Catch and slip bonds, antibody–antigen pairs, and cell-adhesion complexes. An extension of Table 3 used by AFM and the biomembrane force probe.
